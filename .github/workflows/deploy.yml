name: Build, Push and Update GitOps

on:
  push:
    branches: ["prod"]

env:
  DOCKER_IMAGE_NAME: manav23/nodeserver
  DOCKER_REGISTRY: docker.io
  VERSION: latest
  DOCKERFILE_PATH: ./Dockerfile
  DEPLOYMENT_REPO: timoni-sample-app
  IMAGE_CUE_PATH: image.cue

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          file: ${{ env.DOCKERFILE_PATH }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

      - name: Extract Digest
        run: echo "DIGEST=${{ steps.build.outputs.digest }}" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # PHASE 1: CREATE THE PR (Using App 1)
      # ---------------------------------------------------------
      - name: Generate Creator App Token
        id: creator-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TIMONI_APP_ID }}
          private-key: ${{ secrets.TIMONI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.DEPLOYMENT_REPO }}

      - name: Checkout Deployment Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.DEPLOYMENT_REPO }}
          ref: prod
          token: ${{ steps.creator-token.outputs.token }}
          path: deployment-repo

      - name: Update image.cue
        working-directory: deployment-repo
        run: |
          sed -i 's|tag:.*|tag: "${{ env.VERSION }}"|' ${{ env.IMAGE_CUE_PATH }}
          sed -i "s|digest:[[:space:]]*\"[^\"]*\"|digest: \"${DIGEST}\"|" ${{ env.IMAGE_CUE_PATH }}
          
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.creator-token.outputs.token }}
          path: deployment-repo
          commit-message: "chore: update image digest to ${{ steps.build.outputs.digest }}"
          branch: bot/image-update-${{ github.sha }}
          base: prod
          title: "Auto: Update image digest"
          body: "Automated image update from CI"

      # ---------------------------------------------------------
      # PHASE 2: APPROVE THE PR (Using App 2)
      # ---------------------------------------------------------
      - name: Generate Approver App Token
        id: approver-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APPROVER_APP_ID }}
          private-key: ${{ secrets.APPROVER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.DEPLOYMENT_REPO }}

      - name: Approve PR as CodeOwner
        run: |
          gh pr review ${{ steps.cpr.outputs.pull-request-number }} \
            --repo ${{ github.repository_owner }}/${{ env.DEPLOYMENT_REPO }} \
            --approve \
            --body "Approved by CodeOwner Bot."
        env:
          # The Approver token provides the required review
          GH_TOKEN: ${{ steps.approver-token.outputs.token }} 

      # ---------------------------------------------------------
      # PHASE 3: MERGE THE PR
      # ---------------------------------------------------------
      - name: Auto-Merge PR
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} \
            --repo ${{ github.repository_owner }}/${{ env.DEPLOYMENT_REPO }} \
            --squash --auto
        env:
          # The Creator token finalizes the merge
          GH_TOKEN: ${{ steps.creator-token.outputs.token }}
