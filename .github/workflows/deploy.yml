name: Build, Push and Update GitOps

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the tag update back to the repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: manav23/nodeserver:${{ github.sha }}
          build-args: |
            IMAGE_TAG=${{ github.sha }}

      - name: Update Kustomize Manifest
        run: |
          cd k8s/overlays/production
          # Update the kustomization.yaml image tag to the current Git SHA
          kustomize edit set image manav23/nodeserver=manav23/nodeserver:${{ github.sha }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          # [skip ci] prevents the workflow from triggering itself in a loop
          git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
          git push