name: Build, Push and Update GitOps

on:
  push:
    branches: ["prod"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout source repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Login to DockerHub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build and Push Image
      - name: Build and Push Image
        id: build   # ✅ REQUIRED for digest
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            manav23/nodeserver:latest
            manav23/nodeserver:${{ github.sha }}


      # - name: Update Kustomize Manifest
      #   run: |
      #     cd k8s/overlays/production
      #     # Update the kustomization.yaml image tag to the current Git SHA
      #     kustomize edit set image manav23/nodeserver=manav23/nodeserver:${{ github.sha }}

      # - name: Commit and Push Changes
      #   run: |
      #     git config --global user.name "github-actions[bot]"
      #     git config --global user.email "github-actions[bot]@users.noreply.github.com"
      #     git add k8s/overlays/production/kustomization.yaml
      #     # [skip ci] prevents the workflow from triggering itself in a loop
      #     git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
      #     git push
      # 4. Extract Digest 
      - name: Extract Digest
        run: |
          echo "DIGEST=${{ steps.build.outputs.digest }}" >> $GITHUB_ENV

      # 5. Debug Digest (optional but recommended)
      - name: Debug Digest
        run: |
          echo "Digest is: $DIGEST"

      # 6. Checkout Deployment Repo
      - name: Checkout Deployment Repo
        uses: actions/checkout@v4
        with:
          repository: manavnmodi/timoni-sample-app
          ref: ${{ github.ref_name }}
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: timoni-sample-app

      # 7. Update image.cue
      - name: Update image.cue
        working-directory: timoni-sample-app
        run: |
          echo "Updating image.cue..."

          echo "Before:"
          cat image.cue

          # Ensure tag is always latest
          sed -i 's|tag:.*|tag: "latest"|' image.cue

          # Update digest 
          sed -i "s|digest:[[:space:]]*\"[^\"]*\"|digest: \"${DIGEST}\"|" image.cue

          echo "After:"
          cat image.cue

      # 8. Commit and Push
      - name: Commit and Push Changes
        working-directory: timoni-sample-app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add image.cue

          git diff --quiet && echo "No changes detected" && exit 0

          git commit -m "chore: update image digest to ${DIGEST}"
          
          git push origin ${{ github.ref_name }}
          
