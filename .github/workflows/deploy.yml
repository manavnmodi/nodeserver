name: Build, Push and Update GitOps

on:
  push:
    branches: ["prod"]

env:
  DOCKER_IMAGE_NAME: manav23/nodeserver
  DOCKER_REGISTRY: docker.io
  VERSION: latest
  DOCKERFILE_PATH: ./Dockerfile
  DEPLOYMENT_REPO: timoni-sample-app
  DEPLOYMENT_BRANCH: prod
  IMAGE_CUE_PATH: image.cue

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          file: ${{ env.DOCKERFILE_PATH }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

      - name: Extract Digest
        run: echo "DIGEST=${{ steps.build.outputs.digest }}" >> $GITHUB_ENV

      # 🔑 Always needed — exchanges static creds for short-lived token
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TIMONI_APP_ID }}
          private-key: ${{ secrets.TIMONI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.DEPLOYMENT_REPO }}

      - name: Get Bot Identity
        id: bot
        run: |
          BOT_NAME="${{ steps.app-token.outputs.app-slug }}[bot]"
          BOT_ID=$(curl -s \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            https://api.github.com/users/${BOT_NAME} | jq -r '.id // "0"')
          echo "name=${BOT_NAME}" >> $GITHUB_OUTPUT
          echo "id=${BOT_ID}" >> $GITHUB_OUTPUT

      - name: Checkout Deployment Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.DEPLOYMENT_REPO }}
          ref: ${{ env.DEPLOYMENT_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          path: deployment-repo

      - name: Update image.cue
        working-directory: deployment-repo
        run: |
          sed -i 's|tag:.*|tag: "${{ env.VERSION }}"|' ${{ env.IMAGE_CUE_PATH }}
          sed -i "s|digest:[[:space:]]*\"[^\"]*\"|digest: \"${DIGEST}\"|" ${{ env.IMAGE_CUE_PATH }}
          cat ${{ env.IMAGE_CUE_PATH }}

      - name: Commit and Push
        working-directory: deployment-repo
        run: |
          git config user.name "${{ steps.bot.outputs.name }}"
          git config user.email "${{ steps.bot.outputs.id }}+${{ steps.bot.outputs.name }}@users.noreply.github.com"
          git add ${{ env.IMAGE_CUE_PATH }}
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update image digest to ${DIGEST} [skip ci]"
          git push origin ${{ env.DEPLOYMENT_BRANCH }}
